<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">

<meta name="theme-color" content="#0b3c5d">
<style>html{-webkit-text-size-adjust:100%}:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}</style>
<title>Data Islands</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
/* Layout: an island-hopping adventure. A sea-chart world map leads to island pages (story + plan + project file), and levels play one card at a time with a game footer. */
:root {
  --ocean-deep: #0b3c5d;
  --ocean: #11698e;
  --shallow: #5fc9d8;
  --sand: #f3cf7a;
  --sand-deep: #d9a447;
  --leaf: #2f9e44;
  --leaf-deep: #1b6d2f;
  --crystal: #8f5bff;
  --crystal-light: #c7aaff;
  --gem: #ff4f8b;
  --gold: #ffc23d;
  --gold-deep: #c98f12;
  --ink: #13222e;
  --ink-soft: #4b5d6b;
  --paper: #ffffff;
  --mist: #eaf4f7;
  --line: #cfe0e7;
  --ok: #2b9348;
  --ok-bg: #dcf5e1;
  --bad: #d64045;
  --bad-bg: #fde3e3;
  --code-bg: #0f2233;
  --code-ink: #e3eefb;
  --code-dim: #6f8aa3;
  --f-display: "Lilita One", "Arial Rounded MT Bold", "Trebuchet MS", sans-serif;
  --f-body: "Nunito", "Segoe UI", system-ui, sans-serif;
  --f-mono: "JetBrains Mono", ui-monospace, Menlo, Consolas, monospace;
  color-scheme: light;
}
* { box-sizing: border-box; }
html, body { background: var(--mist); }
body { color: var(--ink); font-family: var(--f-body); font-size: 16px; line-height: 1.5; font-weight: 600; }
body[data-view="map"], body[data-view=""] { background: var(--ocean-deep); }
[hidden] { display: none !important; }
a { color: inherit; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }
h1, h2, h3 { margin: 0; text-wrap: balance; }
code { font-family: var(--f-mono); font-size: .88em; }
.eyebrow { font-family: var(--f-body); font-size: 12px; font-weight: 900; letter-spacing: .1em; text-transform: uppercase; color: var(--ink-soft); }
.muted { color: var(--ink-soft); }

/* chunky game buttons */
.gbtn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; border: 0; cursor: pointer; text-decoration: none; text-align: center;
  font-family: var(--f-display); font-size: 18px; letter-spacing: .02em; line-height: 1.1; padding: 13px 22px 12px; border-radius: 14px;
  background: var(--gold); color: var(--ink); box-shadow: 0 5px 0 var(--gold-deep); transition: transform .08s, box-shadow .08s; }
.gbtn:hover { filter: brightness(1.05); }
.gbtn:active { transform: translateY(3px); box-shadow: 0 2px 0 var(--gold-deep); }
.gbtn.green { background: var(--leaf); color: #fff; box-shadow: 0 5px 0 var(--leaf-deep); }
.gbtn.red { background: var(--bad); color: #fff; box-shadow: 0 5px 0 #9e2a2e; }
.gbtn.sand { background: #fff; color: var(--ink); box-shadow: 0 5px 0 var(--line); }
.gbtn.small { font-size: 15px; padding: 9px 14px 8px; border-radius: 11px; box-shadow: 0 4px 0 var(--gold-deep); }
.gbtn.small.sand { box-shadow: 0 4px 0 #9fb8c4; }
.gbtn.big { font-size: 20px; padding: 16px 28px 15px; }
.gbtn[disabled] { background: #d6e1e6; color: #8aa0ad; box-shadow: 0 5px 0 #b9c9d1; cursor: not-allowed; filter: none; transform: none; }

/* svg bits */
.crys path { fill: #d6e1e6; stroke: #9fb3bf; stroke-width: 1.5; }
.crys .facet { fill: rgba(255,255,255,.35); stroke: none; }
.crys.on path { fill: var(--crystal); stroke: #5b2fd1; }
.crys.on .facet { fill: var(--crystal-light); }
.gem path { fill: #e8dfe3; stroke: #c5b5bc; stroke-width: 1.5; }
.gem.on path { fill: var(--gem); stroke: #c2185b; }
.heart path { fill: #d6e1e6; }
.heart.on path { fill: #ff4d5e; stroke: #b3202f; stroke-width: 1.5; }
.maya { width: 44px; height: 44px; border-radius: 50%; flex: none; display: grid; place-items: center; background: var(--crystal); color: #fff; font-family: var(--f-display); font-size: 22px; box-shadow: 0 0 0 3px #fff, 0 0 0 5px var(--crystal); }

/* ---------- map ---------- */
.map-page { max-width: 1100px; margin: 0 auto; padding: 18px max(16px, env(safe-area-inset-right, 0px)) 40px max(16px, env(safe-area-inset-left, 0px)); color: #fff; display: grid; gap: 16px; }
.map-top { display: flex; justify-content: space-between; align-items: center; gap: 14px; flex-wrap: wrap; }
.brand h1 { font-family: var(--f-display); font-size: clamp(34px, 6vw, 52px); letter-spacing: .01em; color: var(--sand); text-shadow: 0 4px 0 rgba(0,0,0,.25); line-height: 1; }
.brand p { margin: 4px 0 0; color: #bfe6f0; font-weight: 800; }
.stats { display: flex; align-items: center; gap: 12px; }
.stat { display: inline-flex; align-items: center; gap: 6px; background: rgba(0,0,0,.25); padding: 6px 12px; border-radius: 99px; font-weight: 800; font-variant-numeric: tabular-nums; }
.stat b { font-family: var(--f-display); font-size: 20px; font-weight: 400; }
.map-frame { border-radius: 22px; overflow: hidden; box-shadow: 0 0 0 4px rgba(255,255,255,.14), 0 20px 40px rgba(0,0,0,.3); }
.world { display: block; width: 100%; height: auto; }
.route { fill: none; stroke: rgba(255,255,255,.6); stroke-width: 4; stroke-dasharray: 2 12; stroke-linecap: round; }
.route.done { stroke: var(--gold); stroke-dasharray: none; stroke-width: 5; }
.isle { cursor: pointer; }
.isle .isle-body { transition: transform .2s; transform-box: fill-box; transform-origin: center; }
.isle:hover .isle-body, .isle:focus-visible .isle-body { transform: translateY(-5px); }
.isle.locked { filter: grayscale(.9); opacity: .55; }
.isle-name { font-family: var(--f-display); font-size: 17px; fill: #fff; letter-spacing: .02em; }
.pip { fill: rgba(255,255,255,.18); stroke: #fff; stroke-width: 1.5; }
.pip.on { fill: var(--crystal); stroke: var(--crystal-light); }
.bob { animation: bob 1.6s ease-in-out infinite; }
@keyframes bob { 50% { transform: translateY(-6px); } }
.smoke { animation: smoke 3s ease-in-out infinite; transform-box: fill-box; }
@keyframes smoke { 50% { transform: translateY(-6px); opacity: .7; } }
.map-cta { display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap; background: #fff; color: var(--ink); border-radius: 18px; padding: 16px 18px; }
.map-cta > div { display: grid; gap: 2px; }
.map-cta b { font-family: var(--f-display); font-size: 26px; font-weight: 400; line-height: 1.1; }
.map-cta span:last-child { color: var(--ink-soft); }

/* ---------- pages ---------- */
.page { max-width: 860px; margin: 0 auto; padding: 18px max(16px, env(safe-area-inset-right, 0px)) 56px max(16px, env(safe-area-inset-left, 0px)); display: grid; gap: 16px; }
.back { font-weight: 800; text-decoration: none; color: var(--ocean); justify-self: start; }
.back:hover { text-decoration: underline; }
.isle-head { display: grid; gap: 6px; background: linear-gradient(135deg, var(--ocean), var(--ocean-deep)); color: #fff; border-radius: 22px; padding: 22px 22px 24px; position: relative; overflow: hidden; }
.isle-head .eyebrow { color: #bfe6f0; }
.isle-head h1 { font-family: var(--f-display); font-weight: 400; font-size: clamp(34px, 6vw, 50px); letter-spacing: .01em; color: var(--sand); line-height: 1.05; text-shadow: 0 3px 0 rgba(0,0,0,.2); }
.isle-head .proj { margin: 0; font-size: 17px; font-weight: 800; }
.isle-head.ship h1 { font-size: clamp(26px, 4.4vw, 38px); }
.isle-head code { background: rgba(255,255,255,.15); padding: 1px 6px; border-radius: 5px; }
.bubble { display: flex; gap: 14px; align-items: flex-start; background: #fff; border-radius: 18px; padding: 16px 18px; box-shadow: 0 3px 0 var(--line); }
.bubble .who { font-size: 13px; font-weight: 900; color: var(--crystal); }
.bubble p { margin: 4px 0 0; max-width: 62ch; }
.bubble.big p { font-size: 18px; line-height: 1.55; }
.sec { font-family: var(--f-display); font-weight: 400; font-size: 26px; margin-top: 8px; }
.sec-sub { margin: -10px 0 0; color: var(--ink-soft); }
.stages { display: flex; align-items: stretch; gap: 0; }
.stage { flex: 1 1 0; min-width: 0; display: grid; gap: 4px; align-content: start; text-decoration: none; background: #fff; border-radius: 16px; padding: 14px; box-shadow: 0 4px 0 var(--line); border: 3px solid transparent; transition: transform .1s; }
.stage:hover { transform: translateY(-2px); }
.stage-n { width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; background: var(--mist); font-family: var(--f-display); font-size: 16px; }
.stage-part { font-family: var(--f-display); font-size: 19px; line-height: 1.15; }
.stage-name { font-size: 14px; color: var(--ink-soft); }
.stage-foot { display: flex; align-items: center; gap: 4px; margin-top: 6px; font-size: 13px; }
.stage-foot em { font-style: normal; font-weight: 900; color: var(--ink-soft); }
.stage.done .stage-n { background: var(--crystal); color: #fff; }
.stage.next { border-color: var(--gold); box-shadow: 0 4px 0 var(--gold-deep); }
.stage.next .stage-n { background: var(--gold); }
.stage.next em { color: var(--ink); }
.stage.locked { opacity: .5; cursor: not-allowed; }
.stage.locked:hover { transform: none; }
.arrow { flex: 0 0 22px; align-self: center; height: 4px; background: var(--sand-deep); position: relative; }
.arrow::after { content: ""; position: absolute; right: -2px; top: -5px; border: 7px solid transparent; border-left-color: var(--sand-deep); border-right: 0; }
.go-row, .row-c { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; margin-top: 4px; }
.won { display: flex; align-items: center; justify-content: space-between; gap: 14px; flex-wrap: wrap; background: #f1ebff; border-radius: 16px; padding: 14px 16px; }
.won > div { display: flex; align-items: center; gap: 10px; }
.file { border-radius: 14px; overflow: hidden; background: var(--code-bg); box-shadow: 0 4px 0 #091725; min-width: 0; }
.file-tab { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 8px 12px; background: #16304a; color: var(--code-ink); font-family: var(--f-mono); font-size: 13px; }
.file-tab span::before { content: ""; display: inline-block; width: 9px; height: 9px; border-radius: 50%; background: var(--gold); margin-right: 8px; }
.tbtn { background: var(--gold); color: var(--ink); border: 0; border-radius: 8px; padding: 4px 10px; font-weight: 900; font-size: 13px; cursor: pointer; }
pre.code { margin: 0; padding: 14px 16px; background: var(--code-bg); color: var(--code-ink); font-family: var(--f-mono); font-size: 13.5px; line-height: 1.6; overflow-x: auto; white-space: pre; border-radius: 12px; font-weight: 400; }
.file pre.code { border-radius: 0; max-height: 420px; overflow: auto; }
.seg.dim { color: var(--code-dim); }
.seg.todo { color: #ffd76a; font-style: italic; opacity: .75; }
.seg.hot { display: inline-block; background: rgba(95, 201, 116, .18); box-shadow: -16px 0 0 rgba(95, 201, 116, .18), 16px 0 0 rgba(95, 201, 116, .18); border-left: 4px solid #5fc974; margin-left: -16px; padding-left: 12px; }

/* ---------- play ---------- */
body[data-view="play"] { background: #fff; }
.play { min-height: 100vh; display: flex; flex-direction: column; }
.play-top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: #fff; display: flex; align-items: center; gap: 14px; padding: 14px max(16px, env(safe-area-inset-right, 0px)) 8px max(16px, env(safe-area-inset-left, 0px)); max-width: 752px; width: 100%; margin: 0 auto; }
body[data-view="play"]::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: #fff; }
.xbtn { text-decoration: none; font-size: 22px; color: #9fb3bf; font-weight: 900; padding: 2px 6px; }
.xbtn:hover { color: var(--ink); }
.pbar { flex: 1; height: 16px; border-radius: 99px; background: #e2ecf0; overflow: hidden; }
.pbar i { display: block; height: 100%; width: 0; background: linear-gradient(var(--leaf), #44c060); border-radius: 99px; transition: width .35s; box-shadow: inset 0 -4px 0 rgba(0,0,0,.12); }
.hearts { display: flex; gap: 3px; }
.hearts.hit { animation: hit .4s; }
@keyframes hit { 25% { transform: translateX(-4px); } 75% { transform: translateX(4px); } }
.play-sub { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; max-width: 752px; width: 100%; margin: 0 auto; padding: 0 max(16px, env(safe-area-inset-right, 0px)) 0 max(16px, env(safe-area-inset-left, 0px)); font-size: 13px; color: var(--ink-soft); }
.chip { background: var(--mist); border-radius: 99px; padding: 3px 10px; font-weight: 900; color: var(--ink); }
.building code { color: var(--ocean); }
.card-wrap { flex: 1; width: 100%; max-width: 720px; margin: 0 auto; padding: 22px max(16px, env(safe-area-inset-right, 0px)) 200px max(16px, env(safe-area-inset-left, 0px)); }
.card { display: grid; gap: 16px; }
.card.in { animation: cardin .25s ease-out; }
@keyframes cardin { from { transform: translateY(8px); opacity: .4; } }
.card.center { text-align: center; justify-items: center; }
.q { font-family: var(--f-body); font-weight: 900; font-size: clamp(21px, 3.2vw, 26px); line-height: 1.3; }
.hintline { margin: -8px 0 0; color: var(--ink-soft); font-size: 14px; }
.opts { display: grid; gap: 10px; }
.opt { display: flex; gap: 12px; align-items: center; text-align: left; background: #fff; border: 2px solid var(--line); border-bottom-width: 5px; border-radius: 14px; padding: 13px 14px; cursor: pointer; font-size: 16px; font-weight: 700; }
.opt:hover:not([disabled]) { background: var(--mist); }
.opt .key { width: 28px; height: 28px; flex: none; border-radius: 8px; border: 2px solid var(--line); display: grid; place-items: center; font-size: 13px; font-weight: 900; color: var(--ink-soft); }
.opt.sel { border-color: var(--ocean); background: #e3f3fa; }
.opt.sel .key { border-color: var(--ocean); color: var(--ocean); }
.opt.right { border-color: var(--ok); background: var(--ok-bg); }
.opt.wrong { border-color: var(--bad); background: var(--bad-bg); }
.opt[disabled] { cursor: default; }
.tbl { overflow-x: auto; border-radius: 12px; border: 2px solid var(--line); background: #fff; }
.tbl table { border-collapse: collapse; width: 100%; font-family: var(--f-mono); font-size: 13.5px; font-weight: 400; }
.tbl th { background: var(--mist); text-align: left; padding: 8px 12px; font-weight: 600; white-space: nowrap; }
.tbl td { padding: 9px 12px; border-top: 1px solid var(--line); white-space: pre; }
.tbl .blank { color: #9fb3bf; font-style: italic; font-family: var(--f-body); }
.tbl tr[data-row][role="button"] { cursor: pointer; }
.tbl tr[role="button"]:hover td { background: #f4fafc; }
.tbl .fl { width: 40px; text-align: center; }
.flagbox { display: inline-block; width: 20px; height: 20px; border-radius: 6px; border: 2px solid #9fb3bf; vertical-align: middle; }
.tbl tr.flagged td { background: #fff1e0; }
.tbl tr.flagged .flagbox { background: var(--bad); border-color: var(--bad); box-shadow: inset 0 0 0 3px #fff; }
.tbl tr.right td { background: var(--ok-bg); }
.tbl tr.wrong td { background: var(--bad-bg); }
.tbl tr.missed td { background: var(--bad-bg); }
.tbl tr.missed .flagbox { border-color: var(--bad); border-style: dashed; }
.match { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 12px; }
.mcol { display: grid; gap: 10px; align-content: start; }
.mcard { text-align: left; background: #fff; border: 2px solid var(--line); border-bottom-width: 5px; border-radius: 14px; padding: 12px; cursor: pointer; font-size: 15px; font-weight: 700; min-height: 56px; word-break: break-word; }
.mcard.sel { border-color: var(--ocean); background: #e3f3fa; }
.mcard.ok { border-color: var(--ok); background: var(--ok-bg); opacity: .75; cursor: default; }
.mcard.bad, .shake { border-color: var(--bad); background: var(--bad-bg); animation: hit .4s; }
.slots { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.slots li.empty { border: 2px dashed var(--line); border-radius: 12px; min-height: 48px; display: flex; align-items: center; padding: 0 14px; color: #9fb3bf; font-weight: 900; }
.pool { display: grid; gap: 8px; }
.piece { width: 100%; text-align: left; background: #fff; border: 2px solid var(--line); border-bottom-width: 5px; border-radius: 12px; padding: 11px 14px; cursor: pointer; font-weight: 700; font-size: 15px; }
.mono .piece, .mono li { font-family: var(--f-mono); font-size: 13.5px; font-weight: 400; white-space: pre-wrap; }
.piece.placed { border-color: var(--ocean); background: #e3f3fa; }
.piece.right { border-color: var(--ok); background: var(--ok-bg); }
.piece.wrong { border-color: var(--bad); background: var(--bad-bg); }
.correct-list { background: var(--ok-bg); border-radius: 12px; padding: 12px 14px; }
.correct-list ol { margin: 6px 0 0; padding-left: 22px; display: grid; gap: 4px; }
.fillcode { line-height: 2.2; }
.slot { font-family: var(--f-mono); font-size: 13.5px; min-width: 64px; padding: 1px 8px; margin: 0 2px; border-radius: 6px; border: 2px dashed #6f8aa3; background: rgba(255,255,255,.06); color: #fff; cursor: pointer; vertical-align: baseline; }
.slot.filled { border-style: solid; border-color: var(--gold); background: rgba(255,194,61,.18); }
.slot.right { border-color: #5fc974; background: rgba(95,201,116,.22); }
.slot.wrong { border-color: #ff6b70; background: rgba(255,107,112,.2); }
.slot s { opacity: .6; }
.chips { display: flex; flex-wrap: wrap; gap: 10px; }
.tok { font-family: var(--f-mono); font-size: 14.5px; background: #fff; border: 2px solid var(--line); border-bottom-width: 5px; border-radius: 12px; padding: 9px 14px; cursor: pointer; }
.tok:hover:not([disabled]) { background: var(--mist); }
.tok[disabled] { opacity: .25; cursor: default; }
.tok.sel { border-color: var(--ocean); background: #e3f3fa; }
.buglines { background: var(--code-bg); border-radius: 12px; padding: 8px 0; overflow-x: auto; }
.bl, .fixline { display: flex; width: 100%; gap: 12px; text-align: left; background: none; border: 0; border-left: 4px solid transparent; padding: 5px 14px; cursor: pointer; color: var(--code-ink); }
.bl code, .fixline code { white-space: pre; font-size: 13.5px; }
.bl .ln, .fixline .ln { color: var(--code-dim); font-family: var(--f-mono); font-size: 12px; min-width: 22px; padding-top: 2px; }
.bl:hover:not([disabled]) { background: rgba(255,255,255,.06); }
.bl.sel { background: rgba(255,194,61,.18); border-left-color: var(--gold); }
.bl.right { background: rgba(255,107,112,.18); border-left-color: #ff6b70; }
.bl.wrong { background: rgba(255,255,255,.04); border-left-color: #6f8aa3; }
.fixline { background: rgba(95,201,116,.18); border-left-color: #5fc974; cursor: default; }
.fixline .ln { color: #8ff0a4; }
.apiwin { display: grid; gap: 12px; background: var(--mist); border-radius: 16px; padding: 14px; }
.api-cities { display: flex; gap: 8px; flex-wrap: wrap; }
.api-req { font-size: 13px; background: #fff; border-radius: 10px; padding: 10px 12px; overflow-x: auto; white-space: nowrap; }
.api-req .verb { font-weight: 900; color: var(--leaf); margin-right: 6px; }
.api-req b { color: var(--ocean); }
#apisend { justify-self: start; }
.api-status { font-weight: 800; color: var(--ink-soft); margin-bottom: 8px; }
.api-status.ok b { color: var(--ok); }
.big-ico { display: flex; gap: 6px; }
.big-ico svg { width: 44px; height: 40px; }
.done-card { text-align: left; }
.burst { display: flex; align-items: center; justify-content: center; gap: 10px; padding: 10px; }
.burst svg { animation: pop .6s cubic-bezier(.2, 1.6, .4, 1); filter: drop-shadow(0 8px 12px rgba(143, 91, 255, .35)); }
@keyframes pop { from { transform: scale(.2) rotate(-20deg); opacity: 0; } }
.done-card > .q, .done-card > p:first-of-type { text-align: center; }
.done-card > p { margin: -6px 0 0; }
.built { font-family: var(--f-display); font-weight: 400; font-size: 22px; margin-top: 8px; }

/* footer */
.foot { position: fixed; left: 0; right: 0; bottom: 0; z-index: 6; background: #fff; border-top: 2px solid #e2ecf0; padding: 14px max(16px, env(safe-area-inset-right, 0px)) calc(16px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
.foot:empty { display: none; }
.foot-in { max-width: 720px; margin: 0 auto; display: flex; align-items: center; justify-content: space-between; gap: 16px; }
.foot .gbtn { min-width: 160px; }
.foot.good { background: var(--ok-bg); border-top-color: #b6e6c0; }
.foot.badf { background: var(--bad-bg); border-top-color: #f5bcbc; }
.fb { display: grid; gap: 4px; max-height: 40vh; overflow: auto; }
.fb strong { font-family: var(--f-display); font-weight: 400; font-size: 24px; }

<script>
const ISLANDS = [];

/* ============ 1. CSV COVE ============ */
const ORDERS_TABLE = { cols: ["order_id", "city", "amount"], rows: [
  ["1001", " austin ", "$1,200.50"],
  ["1002", "Austin", "35.00"],
  ["1003", "AUSTIN", ""],
  ["1004", "Denver", "abc"],
  ["1005", " denver", "18.25"],
] };
ISLANDS.push({
  id: "csv", name: "CSV Cove", kind: "cove",
  project: "Python script that cleans and organizes a messy CSV file",
  file: "clean_orders.py", lang: "python",
  brief: "Every night our old checkout system exports orders.csv, and Finance builds the revenue report from it. This morning the report said Austin sold $0. The file is a mess, and fixing it by hand every night isn't an option.",
  goal: "Write a script that cleans the file automatically, every night, the same way.",
  head: `"""clean_orders.py
Cleans the nightly orders export so the finance report is correct.
"""
import csv`,
  foot: `if __name__ == "__main__":
    rows = read_orders("orders.csv")
    clean, skipped = clean_rows(rows)
    save_orders(clean, "orders_clean.csv")
    print(f"Kept {len(clean)} rows, skipped {skipped}")`,
  sample: { name: "orders.csv", text: "order_id,city,amount\n1001, austin ,\"$1,200.50\"\n1002,Austin,35.00\n1003,AUSTIN,\n1004,Denver,abc\n1005, denver,18.25\n" },
  levels: [
    { id: "csv1", name: "Meet the mess", part: "The rules",
      piece: `# The rules this script enforces:
#   1. city: trim spaces and use Title Case     (" austin " -> "Austin")
#   2. amount: remove "$" and "," then make it a number
#   3. rows with a missing or broken amount are skipped and counted`,
      cards: [
        { t: "story", say: "Here are five rows from last night's file. Before writing any code, a data engineer looks at the data and asks: what's wrong with it, and what would break the report?", show: { table: ORDERS_TABLE } },
        { t: "flag", q: "Tap the rows whose amount can't be added into a revenue total.", table: ORDERS_TABLE, bad: [2, 3],
          why: "A blank and the word \"abc\" aren't numbers. We can't guess what they should be, so the script will skip those rows and count them." },
        { t: "mcq", q: "Finance sees Austin listed three different ways. Why?", opts: ["There are three Austin stores", "It's the same city typed with different spaces and capital letters", "The file is corrupted"], a: 1,
          why: "Computers compare text exactly, so \" austin \", \"Austin\" and \"AUSTIN\" count as three different cities until we standardize them." },
        { t: "match", q: "Match each problem to its fix.", pairs: [
            ["Extra spaces: \" austin \"", ".strip()"],
            ["Mixed case: \"AUSTIN\"", ".title()"],
            ["Money as text: \"$1,200.50\"", "Remove $ and , then float()"],
            ["Blank amount: \"\"", "Skip the row and count it"]],
          why: "Each problem gets one clear rule. Writing the rules down first makes the code easy to write and easy to explain in an interview." },
        { t: "mcq", q: "The file has about 40,000 rows and arrives every night. Why write a script instead of fixing it in Excel?", opts: ["Excel can't open CSV files", "A script applies the same fixes every night, in seconds, without mistakes", "Scripts are required by law"], a: 1,
          why: "Automation is the whole job: repeatable, fast and consistent. That's what \"data pipeline\" means." },
      ] },
    { id: "csv2", name: "Read the file", part: "Read",
      piece: `def read_orders(path):
    with open(path, newline="") as f:
        return list(csv.DictReader(f))`,
      cards: [
        { t: "story", say: "Step one of every pipeline: get the data into your program. Python's built-in csv module reads a file row by row. csv.DictReader turns each row into a dictionary, so you write row[\"city\"] instead of remembering that city is column 2.", show: { code: `{"order_id": "1001", "city": " austin ", "amount": "$1,200.50"}` } },
        { t: "mcq", q: "With csv.DictReader, what is each row?", opts: ["A list: [\"1001\", \" austin \", \"$1,200.50\"]", "A dictionary: {\"order_id\": \"1001\", \"city\": \" austin \", ...}", "One long string"], a: 1,
          why: "The header line becomes the keys. Notice every value is still text, even the amount." },
        { t: "fill", q: "Fill in the blanks to read orders.csv into a list of rows.", code: `import [[0]]

def read_orders(path):
    with [[1]](path, newline="") as f:
        return list(csv.[[2]](f))`, blanks: ["csv", "open", "DictReader"], extra: ["pandas", "read", "reader"],
          why: "with open(...) closes the file automatically when the block ends, even if something goes wrong." },
        { t: "mcq", q: "row = {\"amount\": \"35.00\"}. What is row[\"amount\"] + row[\"amount\"]?", opts: ["70.0", "\"35.0035.00\"", "An error"], a: 1,
          why: "CSV values are text, and + glues text together. That's exactly why we'll convert amounts to numbers." },
        { t: "order", q: "Put these lines in order to print every city in the file.", code: true, items: ["import csv", "with open(\"orders.csv\", newline=\"\") as f:", "    reader = csv.DictReader(f)", "    for row in reader:", "        print(row[\"city\"])"],
          why: "Import, open, create the reader, loop, use each row. The indentation shows which lines live inside which block." },
      ] },
    { id: "csv3", name: "Fix each field", part: "Fix fields",
      piece: `def clean_city(city):
    return city.strip().title()


def to_amount(text):
    return float(text.replace("$", "").replace(",", "").strip())`,
      cards: [
        { t: "story", say: "Now two small helper functions: one fixes city names, one turns money text into a number. Small functions with clear names are easy to test, and a teammate can read each one in seconds." },
        { t: "fill", q: "Make clean_city turn \" aUSTIN \" into \"Austin\".", code: `def clean_city(city):
    return city.[[0]]().[[1]]()`, blanks: ["strip", "title"], extra: ["upper", "split", "lower"],
          why: ".strip() removes spaces at both ends, then .title() capitalizes the first letter of each word." },
        { t: "mcq", q: "What does clean_city(\"  dENVER \") return?", code: `def clean_city(city):
    return city.strip().title()`, opts: ["\"dENVER\"", "\"Denver\"", "\"DENVER\""], a: 1,
          why: "Spaces trimmed, then Title Case: \"Denver\"." },
        { t: "fill", q: "Make to_amount turn \"$1,200.50\" into the number 1200.5.", code: `def to_amount(text):
    return [[0]](text.replace("$", [[1]]).replace([[2]], "").strip())`, blanks: ["float", "\"\"", "\",\""], extra: ["int", "\" \"", "\".\""],
          why: "Replace \"$\" with nothing, replace \",\" with nothing, then float(). int() would fail because of the .50." },
        { t: "bug", q: "This crashes on \"$1,200.50\". Tap the line that causes it.", lines: ["def to_amount(text):", "    text = text.replace(\"$\", \"\")", "    return float(text)"], a: 2,
          fix: "    return float(text.replace(\",\", \"\"))",
          why: "float() can't read the comma in \"1,200.50\". Remove it first." },
        { t: "mcq", q: "to_amount(\"abc\") raises a ValueError. Is that good or bad?", opts: ["Bad: functions should never raise errors", "Good: the error tells the caller this row is broken, and the caller decides what to do", "It doesn't raise anything"], a: 1,
          why: "Small functions report problems; the code that loops over rows decides to skip and count. You'll write that next." },
      ] },
    { id: "csv4", name: "Skip bad rows, save the file", part: "Skip & save",
      piece: `def clean_rows(rows):
    clean, skipped = [], 0
    for row in rows:
        try:
            amount = to_amount(row["amount"])
        except ValueError:
            skipped += 1
            continue
        clean.append({
            "order_id": row["order_id"].strip(),
            "city": clean_city(row["city"]),
            "amount": amount,
        })
    return clean, skipped


def save_orders(rows, path):
    with open(path, "w", newline="") as f:
        writer = csv.DictWriter(f, fieldnames=["order_id", "city", "amount"])
        writer.writeheader()
        writer.writerows(rows)`,
      cards: [
        { t: "story", say: "Some rows will always be broken. A good pipeline doesn't crash on row 30,512, and it doesn't hide problems either. It skips bad rows and counts them, so you can report: kept 39,880 rows, skipped 120." },
        { t: "fill", q: "Skip rows whose amount can't be converted.", code: `for row in rows:
    [[0]]:
        amount = to_amount(row["amount"])
    [[1]] ValueError:
        skipped += 1
        [[2]]`, blanks: ["try", "except", "continue"], extra: ["break", "if", "else"],
          why: "try runs code that might fail, except catches that specific error, and continue jumps to the next row. break would stop processing every row after it." },
        { t: "mcq", q: "Why count skipped rows instead of quietly dropping them?", opts: ["It makes the code faster", "So someone notices if 5,000 rows suddenly fail; silent data loss causes wrong reports", "Python requires it"], a: 1,
          why: "If the skip count jumps one night, something changed upstream. Counting turns a hidden problem into a visible one." },
        { t: "order", q: "Order the lines that save the clean file.", code: true, items: ["with open(\"orders_clean.csv\", \"w\", newline=\"\") as f:", "    writer = csv.DictWriter(f, fieldnames=[\"order_id\", \"city\", \"amount\"])", "    writer.writeheader()", "    writer.writerows(clean)"],
          why: "Open for writing (\"w\"), make a writer that knows the columns, write the header line, then every row." },
        { t: "mcq", q: "Run on the five sample rows from the start of the island. What prints?", opts: ["Kept 5 rows, skipped 0", "Kept 3 rows, skipped 2", "Kept 2 rows, skipped 3"], a: 1,
          why: "Rows 1003 (blank) and 1004 (\"abc\") are skipped; the other three are cleaned and saved." },
      ] },
  ],
});

/* ============ 2. DUPLICATE DUNES ============ */
const CUSTOMERS_TABLE = { cols: ["id", "name", "email", "updated_at"], rows: [
  ["1", "Ava Reyes", "ava@mail.com", "2026-01-03"],
  ["2", "Liam Patel", "liam@mail.com", "2026-02-11"],
  ["3", "Ava Reyes", " AVA@mail.com", "2026-03-20"],
  ["4", "Ava R.", "ava@mail.com", "2026-02-01"],
  ["5", "Liam Patel", "liam.p@work.io", "2026-01-15"],
  ["6", "Maya Kim", "maya@mail.com", "2026-03-02"],
] };
ISLANDS.push({
  id: "dupes", name: "Duplicate Dunes", kind: "dunes",
  project: "Script that identifies duplicate records",
  file: "find_duplicates.py", lang: "python",
  brief: "Marketing sent the spring promo and some customers got it three times. One wrote in: \"Please stop!\" The customer list has the same people in it more than once, typed slightly differently each time.",
  goal: "Write a script that finds the duplicates and keeps one clean record per person.",
  head: `"""find_duplicates.py
Finds customers who appear more than once so marketing emails each person once.
"""
import csv`,
  foot: `if __name__ == "__main__":
    with open("customers.csv", newline="") as f:
        customers = list(csv.DictReader(f))
    seen, duplicates = find_duplicates(customers)
    print(f"{len(customers)} rows, {len(seen)} unique people, {len(duplicates)} duplicates")
    for row in duplicates:
        print("  duplicate:", row["id"], row["email"].strip())
    unique = keep_latest(customers)
    print(f"Keeping {len(unique)} records")`,
  sample: { name: "customers.csv", text: "id,name,email,updated_at\n1,Ava Reyes,ava@mail.com,2026-01-03\n2,Liam Patel,liam@mail.com,2026-02-11\n3,Ava Reyes, AVA@mail.com,2026-03-20\n4,Ava R.,ava@mail.com,2026-02-01\n5,Liam Patel,liam.p@work.io,2026-01-15\n6,Maya Kim,maya@mail.com,2026-03-02\n" },
  levels: [
    { id: "dupes1", name: "Spot the doubles", part: "The rule",
      piece: `# A duplicate = two rows with the same email after cleanup.
# Names are NOT used: two different people can share a name,
# and one person can type their name differently.`,
      cards: [
        { t: "story", say: "Here's a slice of the customer list. Look closely: some of these rows are the same person.", show: { table: CUSTOMERS_TABLE } },
        { t: "flag", q: "Tap every row that repeats an earlier person with the same email (ignore spaces and capitals).", table: CUSTOMERS_TABLE, bad: [2, 3],
          why: "Rows 3 and 4 are Ava again: \" AVA@mail.com\" and \"ava@mail.com\" are the same address once cleaned up." },
        { t: "mcq", q: "Which column is the safest way to decide two rows are the same person?", opts: ["name", "email", "id"], a: 1,
          why: "Names repeat and get typed differently (\"Ava R.\"), and id is just the number each signup got, so duplicates have different ids. An email belongs to one person." },
        { t: "mcq", q: "Rows 2 and 5 are both \"Liam Patel\" but have different emails. What should the script do?", opts: ["Merge them: same name", "Treat them as two records; we can't be sure it's one person", "Delete both"], a: 1,
          why: "A wrong merge mixes two people's data, which is worse than a duplicate email. When unsure, keep both and flag for a human." },
      ] },
    { id: "dupes2", name: "Make emails comparable", part: "Normalize",
      piece: `def normalize_email(email):
    return email.strip().lower()`,
      cards: [
        { t: "story", say: "To a computer, \" AVA@mail.com\" and \"ava@mail.com\" are different strings. Before comparing, normalize: turn every value into one standard form. This one idea solves half of all duplicate problems." },
        { t: "match", q: "Match each string method to what it does.", pairs: [
            [".strip()", "Removes spaces at both ends"],
            [".lower()", "Makes every letter lowercase"],
            [".upper()", "Makes every letter uppercase"],
            [".replace(\" \", \"\")", "Removes every space, even in the middle"]],
          why: "For emails we want .strip() and .lower(): trim the edges and use one case." },
        { t: "fill", q: "Finish normalize_email.", code: `def normalize_email(email):
    return email.[[0]]().[[1]]()`, blanks: ["strip", "lower"], extra: ["title", "upper"],
          why: "Lowercase is the usual standard form for emails because mail servers treat capitals the same." },
        { t: "mcq", q: "What does normalize_email(\"  Ava@Mail.COM \") return?", opts: ["\"Ava@Mail.COM\"", "\"ava@mail.com\"", "\"  ava@mail.com \""], a: 1,
          why: "Spaces trimmed, everything lowercased." },
      ] },
    { id: "dupes3", name: "Catch repeats with a dictionary", part: "Find repeats",
      piece: `def find_duplicates(customers):
    seen = {}
    duplicates = []
    for row in customers:
        key = normalize_email(row["email"])
        if key in seen:
            duplicates.append(row)
        else:
            seen[key] = row
    return seen, duplicates`,
      cards: [
        { t: "story", say: "Comparing every row with every other row is slow: 100,000 rows means about 5 billion comparisons. Instead, keep a dictionary of emails you've already seen. Checking `key in seen` is instant, so one pass through the file is enough.", show: { code: `seen = {
    "ava@mail.com":  {"id": "1", "name": "Ava Reyes", ...},
    "liam@mail.com": {"id": "2", "name": "Liam Patel", ...},
}` } },
        { t: "fill", q: "Finish the loop: repeats go to duplicates, new people go into seen.", code: `for row in customers:
    key = normalize_email(row["email"])
    if key [[0]] seen:
        duplicates.[[1]](row)
    [[2]]:
        seen[key] = row`, blanks: ["in", "append", "else"], extra: ["not", "add", "elif"],
          why: "If we've seen this email, it's a repeat. Otherwise, remember it." },
        { t: "mcq", q: "After this loop runs over the 6 sample customers, how big are seen and duplicates?", table: CUSTOMERS_TABLE, opts: ["6 and 0", "4 and 2", "3 and 3"], a: 1,
          why: "seen holds ava, liam, liam.p and maya (4). Rows 3 and 4 are repeats of ava (2)." },
        { t: "mcq", q: "Why a dictionary for seen instead of a list?", opts: ["Lists can't hold emails", "Looking up a key in a dict is instant; a list checks every item, which gets slow on big files", "Dictionaries sort themselves"], a: 1,
          why: "This is a classic interview point: dict and set lookups are O(1) on average, list lookups are O(n)." },
        { t: "bug", q: "This version only finds 1 of the 2 duplicates. Tap the wrong line.", lines: ["seen = {}", "for row in customers:", "    key = row[\"email\"]", "    if key in seen:", "        duplicates.append(row)", "    else:", "        seen[key] = row"], a: 2,
          fix: "    key = normalize_email(row[\"email\"])",

function currentIsland() { return ISLANDS.find(i => islandOpen(i) && !islandDone(i)) || ISLANDS[ISLANDS.length - 1]; }

function shuffle(a) { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function rng(seed) { let s = seed >>> 0; return () => { s = (s * 1664525 + 1013904223) >>> 0; return s / 4294967296; }; }
let toastT;
function toast(m) { const t = $("#toast"); t.textContent = m; t.classList.add("show"); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove("show"), 2200); }
async function copy(text, pre) {
  try { await navigator.clipboard.writeText(text); toast("Copied"); }
  catch (e) { if (pre) { const r = document.createRange(); r.selectNodeContents(pre); const s = getSelection(); s.removeAllRanges(); s.addRange(r); } toast("Selected. Press Ctrl+C or Cmd+C to copy."); }
}

const heartSvg = on => '<svg class="heart' + (on ? " on" : "") + '" width="24" height="22" viewBox="0 0 24 22" aria-hidden="true"><path d="M12 21 C4 15 1 11 1 7 A5.5 5.5 0 0 1 12 4 A5.5 5.5 0 0 1 23 7 C23 11 20 15 12 21 Z"/></svg>';

/* ---------------- world map ---------------- */
function blob(cx, cy, rx, ry, seed, wob) {
  const r = rng(seed), n = 11, pts = [];
  for (let i = 0; i < n; i++) {
    const a = (i / n) * Math.PI * 2, k = 1 - wob + r() * wob * 2;
    pts.push([cx + Math.cos(a) * rx * k, cy + Math.sin(a) * ry * k]);
  }
  let d = "";
  for (let i = 0; i < n; i++) {
    const p = pts[i], q = pts[(i + 1) % n], m = [(p[0] + q[0]) / 2, (p[1] + q[1]) / 2];
    d += (i === 0 ? "M" + ((pts[n - 1][0] + p[0]) / 2).toFixed(1) + " " + ((pts[n - 1][1] + p[1]) / 2).toFixed(1) : "") + " Q" + p[0].toFixed(1) + " " + p[1].toFixed(1) + " " + m[0].toFixed(1) + " " + m[1].toFixed(1);
  }
  return d + "Z";
}
function palm(x, y, s) {
  return '<g transform="translate(' + x + " " + y + ") scale(" + s + ')"><path d="M0 0 Q4 -18 1 -34" stroke="#8a5a2b" stroke-width="4" fill="none" stroke-linecap="round"/>' +
    '<path d="M1 -34 Q-14 -40 -22 -30 Q-12 -36 1 -32 Q-6 -46 -16 -48 Q-2 -46 2 -34 Q10 -48 22 -44 Q10 -42 3 -33 Q18 -36 22 -24 Q12 -34 1 -33Z" fill="#2f9e44" stroke="#1b6d2f" stroke-width="1.5"/></g>';
}
function emblem(isl, x, y) {
  const k = isl.kind;
  if (k === "cove") return '<path d="' + blob(x, y - 6, 56, 30, 7, .22) + '" fill="#2f9e44"/>' + palm(x - 18, y - 4, 1) + palm(x + 22, y + 2, .8) +
    '<rect x="' + (x + 44) + '" y="' + (y + 8) + '" width="34" height="7" rx="2" fill="#a0693a"/><rect x="' + (x + 50) + '" y="' + (y + 15) + '" width="3" height="10" fill="#7a4d26"/><rect x="' + (x + 70) + '" y="' + (y + 15) + '" width="3" height="10" fill="#7a4d26"/>';
  if (k === "dunes") return '<path d="M' + (x - 60) + " " + (y + 8) + " Q" + (x - 30) + " " + (y - 30) + " " + x + " " + (y + 4) + '" fill="#e2b45a"/><path d="M' + (x - 10) + " " + (y + 10) + " Q" + (x + 26) + " " + (y - 40) + " " + (x + 62) + " " + (y + 8) + '" fill="#d9a447"/>' +
    '<path d="M' + (x - 42) + " " + (y - 6) + " q10 -6 20 0" + '" stroke="#c48f35" stroke-width="2" fill="none"/>' + palm(x + 50, y + 12, .6);
  if (k === "quarry") {
    let g = '<path d="' + blob(x, y - 6, 56, 32, 21, .18) + '" fill="#8d96a0"/>';
    for (let i = 0; i < 3; i++) for (let j = 0; j < 4; j++) g += '<rect x="' + (x - 40 + j * 20) + '" y="' + (y - 26 + i * 13) + '" width="18" height="11" rx="2" fill="' + (i === 0 ? "#c9d1d8" : "#aeb7c0") + '" stroke="#6f7984" stroke-width="1"/>';
    return g;
  }
  if (k === "reef") return '<circle cx="' + (x - 26) + '" cy="' + (y - 4) + '" r="18" fill="#ff8f7a" stroke="#e5604a" stroke-width="2"/><circle cx="' + (x + 24) + '" cy="' + (y - 14) + '" r="15" fill="#ffb199" stroke="#e5604a" stroke-width="2"/><circle cx="' + (x + 18) + '" cy="' + (y + 16) + '" r="13" fill="#ff8f7a" stroke="#e5604a" stroke-width="2"/>' +
    '<path d="M' + (x - 10) + " " + (y - 6) + " L" + (x + 10) + " " + (y - 12) + " M" + (x + 22) + " " + y + " L" + (x + 20) + " " + (y + 4) + " M" + (x - 10) + " " + (y + 4) + " L" + (x + 6) + " " + (y + 14) + '" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-dasharray="1 5"/>';
  if (k === "peak") return '<path d="' + blob(x, y + 2, 58, 26, 33, .2) + '" fill="#2f9e44"/><path d="M' + (x - 50) + " " + (y + 10) + " L" + (x - 4) + " " + (y - 64) + " L" + (x + 46) + " " + (y + 10) + 'Z" fill="#6c7a89"/><path d="M' + (x - 17) + " " + (y - 43) + " L" + (x - 4) + " " + (y - 64) + " L" + (x + 10) + " " + (y - 42) + " L" + (x + 3) + " " + (y - 46) + " L" + (x - 4) + " " + (y - 38) + " L" + (x - 10) + " " + (y - 46) + 'Z" fill="#fff"/>' +
    '<line x1="' + (x - 4) + '" y1="' + (y - 64) + '" x2="' + (x - 4) + '" y2="' + (y - 82) + '" stroke="#13222e" stroke-width="2.5"/><path d="M' + (x + 4) + " " + (y - 88) + " a10 10 0 0 1 0 14 M" + (x + 9) + " " + (y - 93) + ' a17 17 0 0 1 0 24" stroke="#ffc23d" stroke-width="2.5" fill="none" stroke-linecap="round"/>';
  if (k === "volcano") return '<path d="M' + (x - 62) + " " + (y + 12) + " L" + (x - 14) + " " + (y - 60) + " L" + (x + 16) + " " + (y - 60) + " L" + (x + 64) + " " + (y + 12) + 'Z" fill="#5b3a2e"/><path d="M' + (x - 14) + " " + (y - 60) + " L" + (x + 16) + " " + (y - 60) + " L" + (x + 10) + " " + (y - 50) + " L" + (x + 4) + " " + (y - 32) + " L" + (x - 2) + " " + (y - 46) + " L" + (x - 8) + " " + (y - 40) + 'Z" fill="#ff6a13"/>' +

  return "";
}

function mapSvg() {
  const tall = window.innerWidth < 720;
  const W = tall ? 420 : 1000, H = tall ? 1180 : 640;
  const pos = tall
    ? [[130, 1060], [300, 880], [125, 700], [300, 525], [125, 355], [290, 165]]
    : [[130, 500], [320, 360], [500, 500], [690, 380], [520, 175], [830, 160]];
  const r = rng(5);
  let waves = "";
  for (let i = 0; i < (tall ? 40 : 55); i++) {
    const x = r() * W, y = r() * H;
    waves += '<path d="M' + x.toFixed(0) + " " + y.toFixed(0) + ' q6 -5 12 0 q6 5 12 0" stroke="rgba(255,255,255,.22)" stroke-width="2" fill="none" stroke-linecap="round"/>';
  }
  let path = "";
  for (let i = 0; i < pos.length - 1; i++) {
    const [x1, y1] = pos[i], [x2, y2] = pos[i + 1];
    const cx = (x1 + x2) / 2 + (tall ? (i % 2 ? -60 : 60) : 0), cy = (y1 + y2) / 2 + (tall ? 0 : (i % 2 ? 50 : -50));
    const done = islandDone(ISLANDS[i]);
    path += '<path d="M' + x1 + " " + y1 + " Q" + cx + " " + cy + " " + x2 + " " + y2 + '" class="route' + (done ? " done" : "") + '"/>';
  }
  const cur = currentIsland();
  let isles = "";
  ISLANDS.forEach((isl, i) => {
    const [x, y] = pos[i], open = islandOpen(isl), done = islandDone(isl);
    const nDone = isl.levels.filter(levelDone).length;
    const label = isl.name;
    const lw = label.length * 10.5 + 34;
    isles += '<a href="#island-' + isl.id + '" class="isle' + (open ? "" : " locked") + (done ? " done" : "") + '" aria-label="' + esc(label) + (open ? ", " + nDone + " of " + isl.levels.length + " levels" : ", locked") + '">' +
      '<g class="isle-body"><ellipse cx="' + x + '" cy="' + (y + 6) + '" rx="104" ry="58" fill="#5fc9d8" opacity=".55"/>' +
      '<path d="' + blob(x, y, 86, 46, 11 + i * 7, .16) + '" fill="#f3cf7a" stroke="#dba84b" stroke-width="3"/>' + emblem(isl, x, y) + "</g>" +
      '<g class="isle-label"><rect x="' + (x - lw / 2) + '" y="' + (y + 52) + '" width="' + lw + '" height="30" rx="15" fill="' + (open ? "#13222e" : "#5d6b77") + '"/>' +
      '<text x="' + x + '" y="' + (y + 73) + '" text-anchor="middle" class="isle-name">' + esc(label) + "</text>" +
      (open ? isl.levels.map((l, k) => '<path transform="translate(' + (x - 27 + k * 18) + " " + (y + 88) + ')" d="M6 0 L12 6 L6 15 L0 6 Z" class="pip' + (levelDone(l) ? " on" : "") + '"/>').join("") :
        '<g transform="translate(' + (x - 9) + " " + (y + 88) + ')"><rect x="0" y="7" width="18" height="13" rx="3" fill="#13222e"/><path d="M4 8 V5 A5 5 0 0 1 14 5 V8" stroke="#13222e" stroke-width="3" fill="none"/></g>') +
      "</g></a>";
  });
  const ci = cur.index;
  const av = avatar(pos[ci][0] + (tall ? 70 : 78), pos[ci][1] - 20);
  return '<svg class="world" viewBox="0 0 ' + W + " " + H + '" role="img" aria-label="World map of six islands"><defs><radialGradient id="sea" cx="50%" cy="40%" r="75%"><stop offset="0" stop-color="#1585ab"/><stop offset="1" stop-color="#0b3c5d"/></radialGradient></defs>' +
    '<rect width="' + W + '" height="' + H + '" fill="url(#sea)"/>' + waves + path + isles + av + "</svg>";
}

    '<a class="gbtn" href="' + (allDone ? "#portfolio" : "#island-" + cur.id) + '">' + (allDone ? "Open portfolio" : "Sail there") + "</a></div></div>";

/* ---------------- island ---------------- */
function fileHtml(isl, highlight) {
  const parts = [];
  parts.push('<span class="seg dim">' + esc(isl.head) + "</span>");
  isl.levels.forEach((l, i) => {
    if (levelDone(l) || l.id === highlight) parts.push('<span class="seg' + (l.id === highlight ? " hot" : highlight ? " dim" : "") + '">' + esc(l.piece) + "</span>");
    else parts.push('<span class="seg todo">' + (isl.lang === "sql" ? "-- " : "# ") + "Level " + (i + 1) + " builds this part: " + esc(l.part) + "</span>");
  });
  if (isl.foot) parts.push('<span class="seg' + (islandDone(isl) ? (highlight ? " dim" : "") : " todo") + '">' + (islandDone(isl) ? esc(isl.foot) : "# Final step: wire it all together (unlocks when every level is done)") + "</span>");
  return '<div class="file"><div class="file-tab"><span>' + esc(isl.file) + "</span></div><pre class=\"code\">" + parts.join("\n\n\n") + "</pre></div>";
}
function viewIsland(id) {
  const isl = ISL[id];
  if (!isl) return viewMap();
  if (!islandOpen(isl)) {
    app().innerHTML = '<div class="page"><a class="back" href="#map">← World map</a><div class="panel center"><h2>' + esc(isl.name) + ' is locked</h2><p>Finish ' + esc(ISLANDS[isl.index - 1].name) + " first. Each island builds on the one before it.</p><a class=\"gbtn\" href=\"#island-" + ISLANDS[isl.index - 1].id + '">Go there</a></div></div>';
    return;
  }
  const nextLv = isl.levels.find(l => !levelDone(l));
  const tiles = isl.levels.map((l, i) => {
    const open = levelOpen(l), done = levelDone(l), next = nextLv && nextLv.id === l.id;
    return (i ? '<span class="arrow" aria-hidden="true"></span>' : "") +
      '<a class="stage' + (done ? " done" : "") + (next ? " next" : "") + (open ? "" : " locked") + '" href="' + (open ? "#play-" + l.id : "#island-" + isl.id) + '"' + (open ? "" : ' aria-disabled="true"') + ">" +
      '<span class="stage-n">' + (i + 1) + '</span><span class="stage-part">' + esc(l.part) + '</span><span class="stage-name">' + esc(l.name) + "</span>" +
      '<span class="stage-foot">' + (done ? crystalSvg(true) + (P.done[l.id].gem ? gemSvg(true) : "") + "<em>Replay</em>" : next ? "<em>Play</em>" : "<em>Locked</em>") + "</span></a>";
  }).join("");
  const done = islandDone(isl);
  app().innerHTML = '<div class="page isle-page k-' + isl.kind + '"><a class="back" href="#map">← World map</a>' +
    '<header class="isle-head"><span class="eyebrow">Island ' + (isl.index + 1) + " of " + ISLANDS.length + "</span><h1>" + esc(isl.name) + '</h1><p class="proj">Project: ' + esc(isl.project) + "</p></header>" +
    '<div class="bubble">' + mayaHtml + '<div><div class="who">Maya · Lead Data Engineer</div><p>' + esc(isl.brief) + "</p><p><b>" + esc(isl.goal) + "</b></p></div></div>" +
    '<h2 class="sec">The plan</h2><p class="sec-sub">Each level builds one part of ' + esc(isl.file) + ".</p>" +
    '<div class="stages">' + tiles + "</div>" +
    (done ? '<div class="won"><div>' + crystalSvg(true, 28) + '<b>Island complete.</b> Your project is ready to ship.</div><a class="gbtn" href="#ship-' + isl.id + '">Ship it to your portfolio</a></div>'
      : nextLv ? '<div class="go-row"><a class="gbtn big" href="#play-' + nextLv.id + '">Play level ' + (nextLv.index + 1) + ": " + esc(nextLv.name) + "</a></div>" : "") +
    '<h2 class="sec">Your project so far</h2><p class="sec-sub">Watch the file fill in as you clear levels.</p>' + fileHtml(isl) + "</div>";
}

/* ---------------- play ---------------- */
let PL = null;

  app().innerHTML = '<div class="play k-' + l.island.kind + '"><div class="play-top"><a class="xbtn" href="#island-' + l.island.id + '" aria-label="Quit level">✕</a>' +

    '<div class="play-sub"><span class="chip">Level ' + (l.index + 1) + " · " + esc(l.name) + '</span><span class="building">Part of your script <code>' + esc(l.island.file) + "</code>: " + esc(l.part) + "</span></div>" +
    '<main class="card-wrap"><div id="card"></div></main><footer class="foot" id="foot"></footer></div>';
  renderCard();
}
function setHearts() { $("#hearts").innerHTML = [0, 1, 2, 3, 4].map(i => heartSvg(i < PL.hearts)).join(""); }

const R = {}; // renderers
R.story = {
  html: c => '<div class="bubble big">' + mayaHtml + '<div><div class="who">Maya</div><p>' + linkTerms(esc(c.say)) + "</p></div></div>" +
    (c.show ? (c.show.table ? tableHtml(c.show.table) : codeHtml(c.show.code)) : ""),
  passive: true,
};
R.mcq = {
  html: c => '<h2 class="q">' + linkTerms(esc(c.q)) + "</h2>" + (c.code ? codeHtml(c.code) : "") + (c.table ? tableHtml(c.table) : "") +
    '<div class="opts">' + c._opts.map((o, k) => '<button class="opt" data-k="' + k + '"><span class="key">' + (k + 1) + "</span><span>" + esc(c.opts[o]) + "</span></button>").join("") + "</div>",
  prep: c => { c._opts = shuffle(c.opts.map((_, i) => i)); },
  bind: (el, c, st, ready) => el.addEventListener("click", e => {
    const b = e.target.closest(".opt"); if (!b || st.locked) return;
    $$(".opt", el).forEach(x => x.classList.remove("sel")); b.classList.add("sel"); st.sel = c._opts[+b.dataset.k]; ready(true);
  }),
  check: (c, st) => st.sel === c.a,
  reveal: (el, c, st, ok) => { $$(".opt", el).forEach(b => { const v = c._opts[+b.dataset.k]; b.disabled = true; if (v === c.a) b.classList.add("right"); else if (v === st.sel) b.classList.add("wrong"); }); },
  answer: c => c.opts[c.a],
};
R.match = {
  html: c => '<h2 class="q">' + esc(c.q) + '</h2><p class="hintline">Tap a card on the left, then its partner on the right.</p><div class="match"><div class="mcol">' +
    c.pairs.map((p, i) => '<button class="mcard" data-l="' + i + '">' + esc(p[0]) + "</button>").join("") + '</div><div class="mcol">' +
    c._right.map(i => '<button class="mcard" data-r="' + i + '">' + esc(c.pairs[i][1]) + "</button>").join("") + "</div></div>",
  prep: c => { do { c._right = shuffle(c.pairs.map((_, i) => i)); } while (c.pairs.length > 1 && c._right.every((v, i) => v === i)); },
  auto: true,
  bind: (el, c, st, ready, finish, hurt) => {
    st.matched = 0; st.sel = null;
    el.addEventListener("click", e => {
      const b = e.target.closest(".mcard"); if (!b || b.disabled) return;
      if (b.dataset.l !== undefined) { $$("[data-l]", el).forEach(x => x.classList.remove("sel")); b.classList.add("sel"); st.sel = +b.dataset.l; return; }
      if (st.sel === null) { b.classList.add("shake"); setTimeout(() => b.classList.remove("shake"), 400); return; }
      const r = +b.dataset.r, l = $('[data-l="' + st.sel + '"]', el);

        l.classList.remove("sel"); l.classList.add("ok"); b.classList.add("ok"); l.disabled = b.disabled = true; st.sel = null; st.matched++;
        if (st.matched === c.pairs.length) finish(!st.miss);
      } else {
        b.classList.add("bad"); l.classList.add("bad");
        setTimeout(() => { b.classList.remove("bad"); l.classList.remove("bad"); }, 450);

      }
    });
  },
};
R.order = {
  html: c => '<h2 class="q">' + esc(c.q) + '</h2><p class="hintline">Tap the pieces in the right order. Tap a placed piece to send it back.</p>' +

  prep: c => { do { c._pool = shuffle(c.items.map((_, i) => i)); } while (c._pool.every((v, i) => v === i)); },

/* ---------------- word help ---------------- */
const GL = GLOSSARY.map(([term, def]) => ({ term, def, keys: [term].concat(GLOSSARY_ALIASES[term] || []) }));
const PROSE = new Set(PROSE_TERMS);
const isWordKey = k => /^[A-Za-z_][A-Za-z_ \-]*$/.test(k);
const reEsc = s => s.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
function wordsFor(c) {
  const prose = [c.q, c.say].filter(Boolean).join(" \n ");
  const chips = (c.blanks || []).concat(c.extra || []);
  const code = [typeof c.code === "string" ? c.code : "", (c.lines || []).join("\n"), c.code === true ? (c.items || []).join("\n") : "", c.table ? c.table.cols.join(" ") : ""].filter(Boolean).join("\n");
  const mixed = [(c.opts || []).join("\n"), (c.pairs || []).map(p => p.join("\n")).join("\n"), c.code !== true ? (c.items || []).join("\n") : ""].join("\n");
  const found = [];
  GL.forEach(g => {
    let hit = false;
    for (const k of g.keys) {
      if (chips.indexOf(k) >= 0) { hit = true; break; }
      if (!isWordKey(k)) { if (k.length > 3 && (code.indexOf(k) >= 0 || mixed.indexOf(k) >= 0)) { hit = true; break; } continue; }
      const re = new RegExp("(^|[^A-Za-z_])" + reEsc(k) + "(?![A-Za-z_])", PROSE.has(g.term) ? "i" : "");
      if (re.test(code)) { hit = true; break; }
      if (new RegExp("(^|[^A-Za-z_])" + reEsc(k) + "\\s*\\(").test(mixed) || ((PROSE.has(g.term) || /^[A-Z][A-Z_ ]+$/.test(k)) && re.test(mixed))) { hit = true; break; }
      if ((PROSE.has(g.term) || /[A-Z]/.test(k)) && re.test(prose)) { hit = true; break; }
    }
    if (hit && !found.some(f => f.def === g.def)) found.push(g);
  });
  return found.slice(0, 14);
}
function linkTerms(escaped) {
  let out = escaped;
  const used = new Set();
  GL.filter(g => PROSE.has(g.term)).forEach(g => {
    for (const k of g.keys) {
      if (used.has(g.term)) break;
      const re = new RegExp("(^|[^A-Za-z_>&;])(" + reEsc(k) + ")(?![A-Za-z_])", "i");
      if (re.test(out)) {
        out = out.replace(re, (m, p, w) => p + '<button type="button" class="term" data-term="' + esc(g.term) + '">' + w + "</button>");
        used.add(g.term);
      }
    }
  });
  return out;
}

}

  const nxt = ISLANDS[isl.index + 1];
  app().innerHTML = '<div class="page"><a class="back" href="#island-' + id + '">← ' + esc(isl.name) + '</a><header class="isle-head ship"><span class="eyebrow">Project complete</span><h1>' + esc(isl.project) + "</h1>" +
    '<p class="proj">Put these files in a GitHub repository named <code>' + esc(isl.file.replace(/\..*$/, "").replace(/_/g, "-")) + "</code> and pin it to your profile.</p></header>" +
    (bullets.length ? '<div class="resume-unlock"><span class="eyebrow">Resume line unlocked</span>' + bullets.map(b => "<p>" + esc(b.text) + "</p>").join("") + "</div>" : "") +
    files.map((f, i) => '<div class="file"><div class="file-tab"><span>' + esc(f[0]) + '</span><button class="tbtn" data-copy="' + i + '">Copy</button></div><pre class="code" data-pre="' + i + '">' + esc(f[1]) + "</pre></div>").join("") +
    '<div class="row-c">' + (nxt ? '<a class="gbtn" href="#island-' + nxt.id + '">Sail to ' + esc(nxt.name) + "</a>" : '<a class="gbtn" href="#portfolio">See your whole portfolio</a>') + '<a class="gbtn sand" href="#map">World map</a></div></div>';
  app().onclick = e => { const b = e.target.closest("[data-copy]"); if (b) copy(files[+b.dataset.copy][1], $('[data-pre="' + b.dataset.copy + '"]')); };
}
function viewPortfolio() {
  app().innerHTML = '<div class="page"><a class="back" href="#map">← World map</a><header class="isle-head"><span class="eyebrow">Your career board</span><h1>Portfolio</h1><p class="proj">Every island becomes a GitHub project and a line on your resume.</p></header>' +
    '<h2 class="sec">Projects</h2><div class="plist">' + ISLANDS.map(isl => {
      const d = islandDone(isl), n = isl.levels.filter(levelDone).length;
      return '<a class="pitem' + (d ? " done" : "") + '" href="' + (d ? "#ship-" : "#island-") + isl.id + '"><span class="pi-isle">' + esc(isl.name) + '</span><b>' + esc(isl.project) + '</b><span class="pi-stat">' + isl.levels.map(l => crystalSvg(levelDone(l), 14)).join("") + (d ? " Ready to ship" : islandOpen(isl) ? " " + n + "/" + isl.levels.length + " levels" : " Locked") + "</span></a>";
    }).join("") + "</div>" +
    '<h2 class="sec">Resume lines</h2><ul class="rlist">' + RESUME.map(b => '<li class="' + (islandDone(ISL[b.island]) ? "on" : "") + '"><span class="tick" aria-hidden="true"></span><span>' + esc(b.text) + '<small>' + (islandDone(ISL[b.island]) ? "Earned on " : "Unlocks on ") + esc(ISL[b.island].name) + "</small></span></li>").join("") + "</ul></div>";
}

/* ---------------- router ---------------- */
function route() {
  closeSheet();
  app().onclick = null;
  const h = (location.hash || "#map").slice(1);
  const i = h.indexOf("-"), base = i < 0 ? h : h.slice(0, i), arg = i < 0 ? "" : h.slice(i + 1);
  document.body.dataset.view = base;
  if (base === "island") viewIsland(arg);
  else if (base === "play") startLevel(arg);
  else if (base === "ship") viewShip(arg);
  else if (base === "portfolio") viewPortfolio();
  else viewMap();
  if (base !== "play") window.scrollTo(0, 0);
}
window.addEventListener("hashchange", route);
let rz; window.addEventListener("resize", () => { clearTimeout(rz); rz = setTimeout(() => { if (document.body.dataset.view === "map" || !location.hash || location.hash === "#map") viewMap(); }, 200); });
document.addEventListener("keydown", e => {
  if (document.body.dataset.view !== "play") return;
  const go = $("#go");
  if (e.key === "Enter" && go && !go.disabled && document.activeElement && !document.activeElement.closest("tr[data-row]")) { e.preventDefault(); go.click(); return; }
  if (/^[1-4]$/.test(e.key)) { const o = $$(".opt")[+e.key - 1]; if (o && !o.disabled) o.click(); }
});
route();
})();

</script>
</body>
</html>
